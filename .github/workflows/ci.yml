name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Node runs the browser page's detector script, so tests/test_page.py can compare it with the Python engine.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Page is built from the current rulepack and model
        run: python scripts/build_page.py --check

      - name: Tests
        run: python -m pytest -q tests
